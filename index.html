<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Totem CBP - Corpo Bandistico Pontolliese</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

:root{
  --ink:#1B2740;
  --ink-2:#243256;
  --red:#ED1C24;
  --red-dark:#B8151B;
  --blue:#4A5D90;
  --blue-light:#8592B8;
  --green:#2C8338;
  --cream:#F5F3EE;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;height:100%;
  background:#000;
  overflow:hidden;
  font-family:'IBM Plex Sans',sans-serif;
}

.tv{
  position:relative;
  width:100vw;height:100vh;
  background:var(--ink);
  color:var(--cream);
}

/* ---- scene framework ---- */
.scene{
  position:absolute; inset:0;
  opacity:0;
  transition:opacity 800ms ease-in-out;
  pointer-events:none;
}
.scene.active{opacity:1; pointer-events:auto;}

/* ---- footer context bar ---- */
.contextbar{
  position:absolute;
  left:0; right:0; bottom:0;
  height:104px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 48px;
  background:rgba(0,0,0,0.32);
  font-size:15px;
  letter-spacing:.02em;
  color:var(--blue-light);
  z-index:10;
}
.contextbar .brand{
  display:flex; align-items:center; gap:14px;
}
.contextbar .brand img{height:68px; width:auto; display:block;}
.contextbar .brand span{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:18px;
  color:var(--cream);
}
.contextbar .clock{font-variant-numeric:tabular-nums;}

/* ---- SCENE: impegni ---- */
.s-impegni{padding:110px 100px 166px;}
.s-impegni h2{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:44px;
  margin-bottom:56px;
  color:var(--cream);
  border-left:5px solid var(--red);
  padding-left:20px;
}
.impegno{
  display:flex; align-items:baseline; gap:36px;
  padding:22px 0;
  border-bottom:1px solid rgba(245,243,238,0.14);
}
.impegno .data{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:40px;
  color:var(--red);
  width:150px;
  flex-shrink:0;
}
.impegno .dettaglio .titolo{font-size:26px;font-weight:500;}
.impegno .dettaglio .ora{font-size:17px;opacity:.65; margin-top:4px;}

/* ---- SCENE: avviso ---- */
.s-avviso{
  display:flex; align-items:center; justify-content:center;
  background: linear-gradient(160deg, var(--red-dark) 0%, var(--red) 100%);
  padding:0 140px;
}
.s-avviso .wrap{max-width:1100px;}
.s-avviso .eyebrow{
  font-size:16px; letter-spacing:.03em; color:rgba(245,243,238,0.85); margin-bottom:22px;
  text-transform:uppercase;
}
.s-avviso p{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:52px;
  line-height:1.28;
}

/* ---- SCENE: compleanni ---- */
.s-compleanni{padding:110px 100px 166px;}
.s-compleanni h2{
  font-family:'Fraunces',serif; font-weight:500; font-size:44px; margin-bottom:56px; color:var(--cream);
  border-left:5px solid var(--blue); padding-left:20px;
}
.persona{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 0;
  border-bottom:1px solid rgba(245,243,238,0.14);
  font-size:30px;
}
.persona .nome{font-family:'Fraunces',serif; font-weight:500;}
.persona .quando{font-size:18px; color:var(--blue-light); }
.persona.oggi .nome{color:var(--red);}
.persona.oggi .quando{
  background:var(--red); color:var(--cream);
  padding:6px 16px; border-radius:2px; font-weight:600;
}

/* ---- SCENE: foto ---- */
.s-foto{padding:0;}
.s-foto img.bg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; filter:blur(50px) brightness(.55) saturate(1.15);
  transform:scale(1.15);
}
.s-foto img.fg{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:contain;
}
.s-foto .caption{
  position:absolute; left:48px; bottom:132px;
  max-width:640px;
  font-family:'Fraunces',serif; font-size:26px; font-weight:500;
  background:rgba(27,39,64,0.6);
  padding:14px 20px;
  border-left:4px solid var(--red);
  z-index:2;
}

/* ---- demo controls (non fanno parte del totem reale) ---- */
.demo{
  position:absolute; top:22px; right:28px; z-index:50;
  display:flex; gap:8px;
}
.demo button{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:13px;
  background:rgba(0,0,0,0.35);
  color:var(--cream);
  border:1px solid rgba(245,243,238,0.35);
  padding:8px 14px;
  cursor:pointer;
}
.demo button.on{background:var(--red); color:var(--cream); border-color:var(--red); font-weight:600;}
</style>
</head>

let stato = { fasce: [], avvisi: [], impegni: [], compleanni: [], foto: [], fotoconfig: {} };
let fasciaSelezionata = null;
let sezioni = [];      // sezioni di contenuto (senza foto), ricostruite ad ogni refresh dati/cambio fascia
let sceneList = [];    // sezioni + foto intercalate, ricomposta ad ogni giro di rotazione
let fotoCursor = 0;
let idx = 0;
let timerId = null;

const scenesEl = document.getElementById('scenes');
const ctxLabel = document.getElementById('ctx-label');
const selettoreEl = document.getElementById('selettoreFasce');

// ============================================================
// FETCH
// ============================================================
async function fetchJSON(tipo, params) {
  const qs = new URLSearchParams({ tipo, ...(params || {}) }).toString();
  const res = await fetch(`${API_BASE}?${qs}`);
  return res.json();
}

async function caricaDati() {
  try {
    const fotoconfig = await fetchJSON('fotoconfig');
    controllaErrore('fotoconfig', fotoconfig);
    stato.fotoconfig = fotoconfig;

    const impegniGiorniAvanti = Number(fotoconfig.impegni_giorni_avanti) || 30;
    const compleanniGiorniPrima = Number(fotoconfig.compleanni_giorni_prima) || 3;
    const compleanniGiorniDopo = Number(fotoconfig.compleanni_giorni_dopo) || 14;

    const [fasce, avvisi, impegni, compleanni] = await Promise.all([
      fetchJSON('fasce'),
      fetchJSON('avvisi'),
      fetchJSON('impegni', { giorni: impegniGiorniAvanti }),
      fetchJSON('compleanni', { giorniPrima: compleanniGiorniPrima, giorniDopo: compleanniGiorniDopo }),
    ]);
    controllaErrore('fasce', fasce);
    controllaErrore('avvisi', avvisi);
    controllaErrore('impegni', impegni);
    controllaErrore('compleanni', compleanni);

    stato.fasce = fasce;
    stato.avvisi = avvisi;
    stato.impegni = impegni;
    stato.compleanni = compleanni;

    costruisciSelettoreFasce();
    if (!fasciaSelezionata || !stato.fasce.find(f => f.etichetta === fasciaSelezionata.etichetta)) {
      fasciaSelezionata = trovaFasciaAttiva() || stato.fasce[0];
    }
    aggiornaSelettore();
    costruisciScene();

    // le foto arrivano dopo (endpoint più lento), la rotazione parte comunque con quello che c'è già
    const foto = await fetchJSON('foto', { n: N_FOTO });
    controllaErrore('foto', foto);
    stato.foto = foto;
    costruisciScene();
  } catch (err) {
    scenesEl.innerHTML = `<div class="scene active s-avviso" style="background:var(--ink);">
      <div class="wrap"><div class="eyebrow">Errore di caricamento</div>
      <p style="font-size:28px;">${err}</p></div></div>`;
  }
}

/** Le risposte con errore arrivano come {error:"..."} invece che come array/oggetto dati —
 *  senza questo controllo verrebbero scambiate silenziosamente per "nessun contenuto". */
function controllaErrore(nomeEndpoint, dato) {
  if (dato && typeof dato === 'object' && !Array.isArray(dato) && dato.error) {
    throw new Error(`Endpoint "${nomeEndpoint}": ${dato.error}`);
  }
}

function trovaFasciaAttiva() {
  const giorni = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
  const ora = new Date();
  const giornoOggi = giorni[ora.getDay()];
  const oraStr = ora.toTimeString().slice(0, 5);
  return stato.fasce.find(f =>
    (f.giorno === giornoOggi || f.giorno === 'Tutti') &&
    f.ora_inizio <= oraStr && oraStr <= f.ora_fine
  );
}

// ============================================================
// SELETTORE FASCE (anteprima/override manuale)
// ============================================================
function costruisciSelettoreFasce() {
  selettoreEl.innerHTML = '';
  stato.fasce.forEach(f => {
    const btn = document.createElement('button');
    btn.textContent = f.etichetta;
    btn.dataset.etichetta = f.etichetta;
    btn.addEventListener('click', () => {
      fasciaSelezionata = f;
      aggiornaSelettore();
      costruisciScene();
    });
    selettoreEl.appendChild(btn);
  });
}

function aggiornaSelettore() {
  selettoreEl.querySelectorAll('button').forEach(btn => {
    btn.classList.toggle('on', fasciaSelezionata && btn.dataset.etichetta === fasciaSelezionata.etichetta);
  });
}

// ============================================================
// COSTRUZIONE SCENE DA DATI REALI
// ============================================================
function formatDataBreve(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long' });
}

function costruisciScene() {
  if (!fasciaSelezionata) return;
  const m = fasciaSelezionata.moduli;
  sezioni = [];

  if (m.impegni && stato.impegni.length) {
    sezioni.push({
      type: 'impegni',
      title: 'Prossimi appuntamenti',
      items: stato.impegni.slice(0, 4).map(ev => {
        const d = new Date(ev.inizio);
        return {
          d: String(d.getDate()).padStart(2, '0'),
          m: d.toLocaleDateString('it-IT', { month: 'short' }).toUpperCase().replace('.', ''),
          titolo: ev.titolo,
          ora: (ev.tuttoIlGiorno ? '' : d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' }) + ' · ') + (ev.luogo || ''),
        };
      }),
    });
  }

  if (m.compleanni && stato.compleanni.length) {
    sezioni.push({
      type: 'compleanni',
      title: 'Compleanni dei soci',
      items: stato.compleanni.map(p => ({
        nome: p.nome,
        quando: p.oggi ? 'Oggi' : formatDataBreve(p.data),
        oggi: p.oggi,
      })),
    });
  }

  const avvisiFiltrati = stato.avvisi.filter(a =>
    (m.avvisi_musicanti && (a.target === 'Musicanti' || a.target === 'Tutti')) ||
    (m.avvisi_scuola && (a.target === 'Scuola' || a.target === 'Tutti'))
  );
  avvisiFiltrati.forEach(a => {
    sezioni.push({
      type: 'avviso',
      eyebrow: 'Avviso',
      testo: a.testo,
    });
  });

  // NB: qui in futuro si possono aggiungere altri tipi di sezione — l'interleaving
  // con le foto qui sotto funziona automaticamente con qualunque sezione presente.

  ctxLabel.textContent = fasciaSelezionata.etichetta;
  idx = 0;
  fotoCursor = 0;
  componiSceneList();
  renderScenes();
  scheduleNext();
}

/** Prende la prossima foto dal pool, facendolo ruotare (si ripete solo se il pool è più
 *  piccolo del numero di slot richiesti in un giro). */
function prossimaFoto() {
  if (!stato.foto.length) return null;
  const f = stato.foto[fotoCursor % stato.foto.length];
  fotoCursor++;
  return f;
}

/** Compone sceneList intercalando una foto dopo ogni sezione di contenuto, invece di
 *  mostrare tutte le foto in blocco una dopo l'altra. Richiamata ad ogni nuovo giro di
 *  rotazione, così le foto mostrate cambiano di ciclo in ciclo. */
function componiSceneList() {
  sceneList = [];
  const includiFoto = fasciaSelezionata.moduli.foto && stato.foto.length;

  if (sezioni.length === 0) {
    sceneList.push({ type: 'vuoto' });
    if (includiFoto) {
      const f = prossimaFoto();
      sceneList.push({ type: 'foto', src: f.url, caption: f.cartella });
    }
    return;
  }

  sezioni.forEach(sezione => {
    sceneList.push(sezione);
    if (includiFoto) {
      const f = prossimaFoto();
      sceneList.push({ type: 'foto', src: f.url, caption: f.cartella });
    }
  });
}

// ============================================================
// RENDER
// ============================================================
function renderScene(scene) {
  if (scene.type === 'impegni') {
    return `<div class="scene s-impegni"><h2>${scene.title}</h2>` +
      scene.items.map(it => `
        <div class="impegno">
          <div class="data">${it.d}<br><span style="font-size:16px;letter-spacing:.05em;">${it.m}</span></div>
          <div class="dettaglio">
            <div class="titolo">${it.titolo}</div>
            <div class="ora">${it.ora}</div>
          </div>
        </div>`).join('') + `</div>`;
  }
  if (scene.type === 'avviso') {
    return `<div class="scene s-avviso"><div class="wrap">
      <div class="eyebrow">${scene.eyebrow}</div>
      <p>${scene.testo}</p>
    </div></div>`;
  }
  if (scene.type === 'compleanni') {
    return `<div class="scene s-compleanni"><h2>${scene.title}</h2>` +
      scene.items.map(p => `
        <div class="persona ${p.oggi ? 'oggi' : ''}">
          <div class="nome">${p.nome}</div>
          <div class="quando">${p.quando}</div>
        </div>`).join('') + `</div>`;
  }
  if (scene.type === 'foto') {
    return `<div class="scene s-foto">
      <img class="bg" src="${scene.src}" alt="">
      <img class="fg" src="${scene.src}" alt="">
      <div class="caption">${scene.caption}</div>
    </div>`;
  }
  if (scene.type === 'vuoto') {
    return `<div class="scene s-avviso" style="background:var(--ink);">
      <div class="wrap"><p style="font-size:32px;">Nessun contenuto per questa fascia al momento.</p></div>
    </div>`;
  }
  return '';
}

function renderScenes() {
  scenesEl.innerHTML = sceneList.map(renderScene).join('');
  showScene(idx);
}

function showScene(i) {
  document.querySelectorAll('.scene').forEach((el, n) => {
    el.classList.toggle('active', n === i);
  });
}

function durataScena(scena) {
  if (!scena) return SECONDI_PER_SCENA_DEFAULT * 1000;
  const chiave = 'durata_' + scena.type + '_secondi';
  const valore = Number(stato.fotoconfig[chiave]);
  const secondi = Number.isFinite(valore) && valore > 0
    ? valore
    : (DURATE_DEFAULT_SECONDI[scena.type] || SECONDI_PER_SCENA_DEFAULT);
  return secondi * 1000;
}

function nextScene() {
  if (!sceneList.length) return;
  idx++;
  if (idx >= sceneList.length) {
    idx = 0;
    componiSceneList(); // nuovo giro di rotazione: le foto cambiano
  }
  renderScenes();
}

function scheduleNext() {
  clearTimeout(timerId);
  timerId = setTimeout(() => {
    nextScene();
    scheduleNext();
  }, durataScena(sceneList[idx]));
}

function tickClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }) + '  ' +
    now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}
setInterval(tickClock, 1000 * 30);
tickClock();

caricaDati();
setInterval(caricaDati, REFRESH_DATI_MS);
</script>
</body>
</html>
